version: 2

before:
  hooks:
    - go mod tidy

builds:
  - env: [CGO_ENABLED=0]
    goos: [linux, darwin, windows]
    goarch: [amd64, arm64]
    # -trimpath keeps build machine paths out of the binary, and the stamped
    # version is what `whoisbutcooler --version` reports. Without the -X the
    # flag defaults to "dev" and a release would not know what it was.
    flags:
      - -trimpath
    ldflags:
      - -s -w -X main.version={{ .Version }}
    # Reproducible builds: without this the archive mtimes are "now", so two
    # builds of the same tag differ.
    mod_timestamp: "{{ .CommitTimestamp }}"

archives:
  - formats: [tar.gz]
    # Windows has no tar by default before Windows 10 1803 and no gzip in
    # Explorer at all, so a .tar.gz is a worse download there than a zip.
    format_overrides:
      - goos: windows
        formats: [zip]
    name_template: "{{ .ProjectName }}_{{ .Os }}_{{ .Arch }}"

checksum:
  name_template: checksums.txt

release:
  # goreleaser fills the release body with the generated changelog and nothing
  # else, so an annotated tag's message never reaches the page — v0.1.1 shipped
  # with two commit subjects where the tag explained what the bug actually was.
  # TagBody is the annotation minus its subject line, which GitHub already shows
  # as the release title.
  header: |
    {{ .TagBody }}

homebrew_casks:
  # Publishes to github.com/PromDungeon/homebrew-tap on every release, so
  # `brew install PromDungeon/tap/whoisbutcooler` works. Homebrew strips the
  # `homebrew-` prefix when resolving a tap name.
  #
  # A cask rather than a formula because this ships a prebuilt binary, which is
  # what Homebrew now wants casks for — goreleaser deprecated `brews:` to match.
  # A personal tap allows that; homebrew-core would insist on building from
  # source, which is one more reason core is not the route here.
  - repository:
      owner: PromDungeon
      name: homebrew-tap
    directory: Casks
    homepage: https://github.com/PromDungeon/whoisbutcooler
    description: IP lookups on a braille world map, with a seven-line summary instead of raw whois
    license: MIT
    binaries:
      - whoisbutcooler
    hooks:
      post:
        install: |
          if system_command("/usr/bin/xattr", args: ["-h"]).exit_status == 0
            system_command "/usr/bin/xattr", args: ["-dr", "com.apple.quarantine", "#{staged_path}/whoisbutcooler"]
          end

changelog:
  sort: asc
  filters:
    exclude: ["^docs:", "^test:"]
